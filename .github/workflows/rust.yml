name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, windows-2025-vs2026, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15, macos-26, macos-27 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --verbose
        working-directory: ./hippocratic_demographics
      - name: Run tests
        run: cargo test --verbose
        working-directory: ./hippocratic_demographics
